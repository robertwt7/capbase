# Capbase production vhost — capbase.fyi. Mounted read-only at
# /etc/nginx/conf.d/capbase.conf (no ${DOMAIN} templating: the domain is fixed).
#
# ⚠️ The domain is hardcoded here AND set as DOMAIN in infra/env/all.env (used
#    for the cert path and SITE_URL). Change both together — `make deploy-tls`
#    checks they agree and refuses to run if they don't.
#
# Only nginx binds a public port. It proxies to the Next.js `web` container over
# the compose network; api (:3000) and jobs (:3002) are never public and the
# browser never talks to them (API_URL is server-only — apps/web/lib/api.ts).

# Only send `Connection: upgrade` when the client actually asked to upgrade.
# (`map` must live in the http context — conf.d/*.conf is included there.)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Rate limiting -----------------------------------------------------------
# nginx is the front line. It keys on $remote_addr, which is the visitor even
# behind Cloudflare (cloudflare-realip.conf swaps the edge address out), and
# hands the same address on as X-Real-IP. The web forwards that to the API on
# every write, where the API's throttler (apps/api/src/throttle) is the backstop
# and the only limit that can key on the signed-in user. 429 rather than
# nginx's default 503 so clients and monitors can tell "slow down" from "down".
limit_req_status 429;
# Credential endpoints: login, register, admin login. Brute-force guard.
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
# Every POST (server actions = contributions, proposals, saves). An empty key
# is never limited, so GETs fall through to the general zone only.
map $request_method $write_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $write_limit_key    zone=writes:10m  rate=30r/m;
# Everything else, per IP: enough for Next's link prefetching on a directory
# page (the burst), well under what one person can click through.
limit_req_zone $binary_remote_addr zone=general:20m rate=10r/s;

# Crawlers, keyed on WHO rather than WHERE. A per-IP limit can't hold a crawler
# back: GPTBot spread ~49k requests/day over 54 addresses, peaking at 2 r/s from
# one — far under `general`, yet every uncached profile render costs the API a
# database round trip, and that pool starved /admin into 504s (2026-10-06).
# So every request whose User-Agent names a bot shares ONE bucket per bot name,
# whatever IP it comes from. The first matching regex wins, so order matters:
#   1. Search engines stay on the per-IP limits only — throttling them costs
#      indexing. (A spoofed Googlebot UA gets exactly the human limits.)
#   2. Anything calling itself a bot/spider/crawler is bucketed by that token
#      (`GPTBot`, `ClaudeBot`, `ShapBot`, `MJ12bot`, …), so a new crawler is
#      covered without editing this list.
#   3. Scripted HTTP clients and an empty UA, bucketed by tool.
# An empty key is never limited, so browsers fall through to `general`.
map $http_user_agent $crawler_key {
    default                                                              "";
    ""                                                                   "empty-ua";
    "~*(googlebot|bingbot|duckduckbot|applebot|yandexbot|baiduspider)"   "";
    "~*(?<bot_name>[a-z0-9_.-]*(bot|spider|crawler|scraper))"            $bot_name;
    "~*(?<client>curl|wget|python-requests|python-urllib|aiohttp|httpx|go-http-client|scrapy|okhttp|axios|node-fetch|java/|libwww-perl|headlesschrome)"  $client;
}
limit_req_zone $crawler_key        zone=crawlers:10m rate=30r/m;
# Error-event ingestion on errors.capbase.fyi (glitchtip.conf).
limit_req_zone $binary_remote_addr zone=ingest:10m  rate=10r/s;

# Wrong Host (scanners hitting the bare IP) gets dropped without a response.
server {
    listen      80 default_server;
    listen      443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/capbase.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capbase.fyi/privkey.pem;

    # The container healthcheck (wget from inside, so it hits this server).
    location = /nginx-health {
        allow      127.0.0.1;
        deny       all;
        access_log off;
        return     200 "ok\n";
    }

    location / { return 444; }
}

server {
    listen      80;
    server_name capbase.fyi;

    # Must stay on :80 — certbot renews via the webroot challenge.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    http2       on;
    server_name capbase.fyi;

    ssl_certificate     /etc/letsencrypt/live/capbase.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capbase.fyi/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Also on :443 for when Cloudflare's "Always Use HTTPS" redirects the
    # renewal challenge here (Let's Encrypt follows the redirect).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # HSTS is a commitment: browsers refuse plain HTTP for capbase.fyi for a
    # year after each visit. Safe here because login already REQUIRES https —
    # auth cookies are secure-only in production.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Enforced: these directives can't break a page — no framing (clickjacking),
    # no plugins, no <base> hijack, forms only post back to us.
    add_header Content-Security-Policy   "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # Report-only until verified on prod: the full fetch allowlist. Next's
    # App Router inlines bootstrap scripts, hence 'unsafe-inline' (no nonces).
    # Open the site, check the console for violations, then move these
    # directives into the enforced header above.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://errors.capbase.fyi https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com" always;

    client_max_body_size 2m;   # contribution forms only — no uploads

    gzip            on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml image/svg+xml;

    # Next hashes these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass       http://web:3001;
        proxy_set_header Host $host;
        add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    # Credential endpoints (route handlers the login/register forms post to).
    # X-Real-IP is the visitor (the web reads it, lib/client-ip.ts); X-Forwarded-For
    # is the client's own claim with that appended, and nothing trusts it.
    location ~ ^/api/(auth|admin)/ {
        limit_req          zone=auth burst=5 nodelay;
        limit_req          zone=general burst=100 nodelay;
        proxy_pass         http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # nginx's own 429s (never the app's — proxy_intercept_errors is off) tell
    # the client when to come back; GPTBot and friends honour Retry-After.
    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type text/plain;
        add_header   Retry-After 60 always;
        return       429 "Too many requests\n";
    }

    location / {
        limit_req          zone=crawlers burst=10 nodelay;
        limit_req          zone=writes burst=20 nodelay;
        limit_req          zone=general burst=100 nodelay;
        proxy_pass         http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# www → apex. Not used at launch (infra/README.md "Search engines"). Enable ONLY
# after (a) adding www.capbase.fyi to the :80 server_name above — otherwise the
# www HTTP-01 challenge hits the default_server 444 — (b) adding a www A record
# and (c) reissuing the cert with both names:
#   CERT_DOMAINS='capbase.fyi www.capbase.fyi' FORCE=1 make deploy-tls
