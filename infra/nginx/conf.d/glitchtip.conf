# GlitchTip vhost — errors.capbase.fyi. Served from the same certificate as the
# apex: issue it with both names once
#   CERT_DOMAINS='capbase.fyi errors.capbase.fyi' FORCE=1 make deploy-tls
#
# The upstream goes through a variable + Docker's resolver so nginx still BOOTS
# when GlitchTip isn't running (a literal `proxy_pass http://glitchtip:8000`
# fails config load on an unresolvable host and would take the site down with
# it). Until `make deploy-glitchtip` this vhost simply answers 502.

server {
    listen      80;
    server_name errors.capbase.fyi;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    http2       on;
    server_name errors.capbase.fyi;

    ssl_certificate     /etc/letsencrypt/live/capbase.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capbase.fyi/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    # See capbase.conf: renewal through Cloudflare's "Always Use HTTPS".
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Event envelopes (with breadcrumbs and stack traces) can be a few MB.
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $glitchtip http://glitchtip:8000;

    # SDK ingestion: browsers post here cross-origin from capbase.fyi. Its own
    # zone, so a burst of client errors can't eat the site's general budget.
    location ~ ^/api/[0-9]+/(envelope|store)/ {
        limit_req          zone=ingest burst=50 nodelay;
        proxy_pass         $glitchtip;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # The dashboard. Sign-in is rate-limited like the site's.
    location /_allauth/ {
        limit_req          zone=auth burst=5 nodelay;
        proxy_pass         $glitchtip;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        limit_req          zone=general burst=200 nodelay;
        proxy_pass         $glitchtip;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
