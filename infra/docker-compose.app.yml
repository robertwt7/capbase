# App stack — web + api + jobs + nginx + certbot. Runs on the App VPS
# (`make deploy-app`) or as part of all-in-one (`make deploy-all`).
# Env: infra/env/app.env  (single VPS: infra/env/all.env).
#
# ⚠️ DATABASE_URL must point at the DB VPS BEFORE `make deploy-app` — see README.
#
# Every service caps its json-file logs (unbounded logs are how a single VPS
# fills its disk) and carries a mem_limit ceiling sized for an 8 GB box.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: capbase-api
    container_name: capbase-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${API_MEM_LIMIT:-768m}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your env file}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Capbase <onboarding@resend.dev>}
    # Internal only — the browser never hits the API (API_URL is server-side).
    # Uncomment to expose on localhost for debugging:
    # ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: capbase-web
    container_name: capbase-web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    environment:
      API_URL: http://api:3000
      # Canonical origin for metadata/sitemap/robots/JSON-LD; defaults to the
      # nginx domain. Override only if the public origin differs (e.g. www).
      SITE_URL: ${SITE_URL:-https://${DOMAIN:?set DOMAIN in your env file}}
      # GA4 measurement id — read server-side at runtime; empty disables GA.
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    # No published port — nginx is the only public entrypoint.
    depends_on:
      api:
        condition: service_healthy

  jobs:
    build:
      context: ../..
      dockerfile: apps/jobs/Dockerfile
    image: capbase-jobs
    container_name: capbase-jobs
    restart: unless-stopped
    logging: *default-logging
    # The highest ceiling: the ADV ingest unzips + parses multi-MB bulk files
    # and the Wikidata sweep buffers large SPARQL results.
    mem_limit: ${JOBS_MEM_LIMIT:-1536m}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your env file}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-capbase-ingest (contact@example.com)}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 6 * * *}
      INGEST_ON_BOOT: ${INGEST_ON_BOOT:-false}
      INGEST_LIMIT: ${INGEST_LIMIT:-50}
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: capbase-nginx
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    # No DOMAIN env / envsubst filter here: the vhost is a static conf, not a
    # template — see infra/nginx/conf.d/capbase.conf.
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Reload every 6h so renewed certs are picked up without a restart. Still
    # re-execs the official entrypoint so its /docker-entrypoint.d scripts run.
    command: sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    container_name: capbase-certbot
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Try renewal every 12h (no-op until ~30 days before expiry).
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

  # One-shot seed against the configured DATABASE_URL: `make deploy-seed`.
  seed:
    image: capbase-api
    profiles: ['seed']
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@capbase.fyi}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_NAME: ${ADMIN_NAME:-Capbase Admin}
    command: ['yarn', 'workspace', '@repo/db', 'seed']

  # One-shot admin password rotation: `make rotate-admin-password`.
  # Separate from `seed` because 001-admin-user never updates an existing user.
  # Reuses the api image for the same reason `seed` does — it carries @repo/db,
  # bcrypt and tsx.
  rotate-admin:
    image: capbase-api
    profiles: ['admin']
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@capbase.fyi}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your env file}
    command: ['yarn', 'workspace', '@repo/db', 'rotate:admin']
